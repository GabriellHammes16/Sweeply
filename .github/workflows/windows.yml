name: Windows checks and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --locked --lib --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: npm run tauri -- build --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: sweeply-windows-preview
          path: |
            src-tauri/target/release/sweeply.exe
          if-no-files-found: error
